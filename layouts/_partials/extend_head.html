<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker
      .register("{{ "sw.js" | relURL }}")
      .catch(function (err) {
        console.warn("Registrazione service worker fallita:", err);
      });
  });
}
</script>
