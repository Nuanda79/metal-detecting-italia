{{- with site.Params.homeInfoParams }}
<div class="home-benvenuto">
    {{ $opts := dict "display" "block" }}
    {{ .Content | $.Page.RenderString $opts }}
</div>
{{- end -}}

{{- with site.Params.socialIcons }}
<div class="home-social">
    {{ partial "social_icons.html" (dict "align" "center") }}
</div>
{{- end -}}

<style>
.home-benvenuto {
  font-size: 15px;
  opacity: 0.75;
  margin: 0.5rem auto 1rem;
  max-width: 55ch;
  text-align: center;
}
.home-benvenuto p { margin: 0; }
.home-social {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 1.5rem;
}
</style>
